<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laman Pribadi Annisa</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #9DC08B;
            font-family: 'Fredoka', cursive;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .title {
            font-size: 30px;
            font-weight: bold;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .image-center {
            width: 500px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .next-button {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1.2rem;
            background: white;
            color: #9DC08B;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        .next-button:hover {
            background: #9DC08B;
            color: white;
            transform: scale(1.1);
        }
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px #9DC08B;
            animation: twinkle 1.5s infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">🌺Selamat Datang di Laman Pribadi Annisa!!🌺</div>
        <a href="nextpage.html" class="next-button">Next Page</a>
        <img src="hijau.jpg" alt="Gambar Aesthetic" class="image-center">
    </div>
    
    <div class="sparkle" style="top: 30%; left: 80%;"></div>
    <div class="sparkle" style="top: 60%; left: 30%;"></div>
    <div class="sparkle" style="top: 80%; left: 50%;"></div>
    <div class="sparkle" style="top: 10%; left: 40%;"></div>
    <div class="sparkle" style="top: 50%; left: 20%;"></div>
    <div class="sparkle" style="top: 70%; left: 90%;"></div>
    <div class="sparkle" style="top: 90%; left: 10%;"></div>
    <div class="sparkle" style="top: 20%; left: 15%;"></div>
    <div class="sparkle" style="top: 45%; left: 95%;"></div>
</body>
</html>
